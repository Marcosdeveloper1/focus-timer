name: Build Flutter APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        id: flutter
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Criar local.properties
        run: |
          echo "flutter.sdk=${{ steps.flutter.outputs.flutter-sdk }}" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties
          echo "FLUTTER_ROOT=${{ steps.flutter.outputs.flutter-sdk }}" >> $GITHUB_ENV

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/focus-timer.jks

      - name: Build APK release (assinado)
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=FLUTTER_BUILD_NUMBER=1
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_FILE: focus-timer.jks

      - name: Build AAB release (assinado)
        run: |
          flutter build appbundle --release --no-tree-shake-icons
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_FILE: focus-timer.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-timer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: focus-timer-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
